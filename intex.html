<!DOCTYPE html>
<html>
<head>
  <title>My Movie Website</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    h1 {
      color: red;
      padding: 20px;
    }

    .movies {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 25px;
    }

    .movie {
      background: #292929;
      padding: 15px;
      width: 200px;
      border-radius: 10px;
    }

    .movie img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 8px;
    }

    button {
      background: red;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>🎬 MY MOVIE WEBSITE</h1>
  <h2>Popular Movies</h2>

  <div class="movies">

    <div class="movie">
      <img src="https://image.tmdb.org/t/p/w500/7WsyChQLEftFiDOVTGkv3hFpyyt.jpg">
      <h2>Avengers</h2>
      <p>Action Movie</p>
      <button onclick="alert('Avengers selected!')">
        Watch Now
      </button>
    </div>

    <div class="movie">
      <img src="https://image.tmdb.org/t/p/w500/gKY6q7SjCkAU6FqvqWybDYgUKIF.jpg">
      <h2>Avatar</h2>
      <p>Adventure Movie</p>
      <button onclick="alert('Avatar selected!')">
        Watch Now
      </button>
    </div>

  <div class="movie">
  <img src="https://image.tmdb.org/t/p/w500/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg">
  <h2>Spider-Man</h2>
  <p>Action Movie</p>
  <button onclick="alert('Spider-Man selected!')">
    Watch Now
  </button>
</div>

</body>
</html>
